name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Site builds and docs/ is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Catches what the build will happily render anyway: a link to a page
      # nobody wrote, a duplicate slug, a page in a module the nav does not
      # know about. Warnings do not fail the build; errors do.
      - name: Content checks
        run: npm run check

      - run: npm run build
      # docs/ is committed so GitHub Pages can serve it straight from the
      # branch with no Pages-source change. That only stays true if it is
      # rebuilt whenever content changes, so fail the build when it drifts.
      - name: Fail if docs/ is stale
        run: |
          if ! git diff --quiet -- docs; then
            echo "docs/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- docs
            exit 1
          fi

      # The build renders a ```lab fence whether or not the lab behind it
      # exists, and the runtime swallows a throwing lab so the page still
      # loads. Nothing else in this workflow executes a line of lab code, so
      # a dead control or an unregistered lab ships silently without this.
      # The runner has Chrome preinstalled, which is why puppeteer-core is
      # enough and the browser-bundling `puppeteer` package is not a dep.
      - name: Labs mount and compute
        run: npm run check:labs
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      # The step above proves a lab responds; it cannot tell you the number
      # is wrong. This pins what each lab should print at its defaults, with
      # the expected values recomputed independently rather than copied from
      # the output -- a constant lifted out of the page would just pin
      # today's bug. Verified complementary: halving the draft cost in the
      # speculative-decoding lab leaves check:labs at 42/42 and fails here.
      - name: Lab arithmetic is right
        run: npm run check:facts
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
