<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · LLM Handbook</title>
<meta name="description" content="{{summary}}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F4E79'/%3E%3Crect x='7' y='8' width='18' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='14' width='12' height='3' rx='1.5' fill='%23A9CCEC'/%3E%3Crect x='7' y='20' width='15' height='3' rx='1.5' fill='%237FB2E0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  // Applied before first paint so the page never flashes the wrong theme.
  (function () {
    try {
      var t = localStorage.getItem("llm-handbook:theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <button class="menu-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false">☰</button>
  <a class="brand" href="index.html">LLM&nbsp;Handbook</a>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search the handbook…" autocomplete="off"
           aria-label="Search" aria-controls="results" aria-expanded="false">
    <div id="results" class="results" role="listbox" hidden></div>
  </div>
  <button class="theme-btn" id="theme-btn" aria-label="Switch theme">◐</button>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">{{nav}}</aside>

  <main id="main" class="main">
    <article class="prose">{{content}}</article>
    {{pager}}
  </main>

  {{toc}}
</div>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  window.__mermaid = mermaid;
  const dark = () => {
    const explicit = document.documentElement.getAttribute("data-theme");
    if (explicit) return explicit === "dark";
    return matchMedia("(prefers-color-scheme: dark)").matches;
  };
  const start = () => {
    mermaid.initialize({
      startOnLoad: false,
      theme: dark() ? "dark" : "neutral",
      securityLevel: "strict",
      fontFamily: "IBM Plex Sans, system-ui, sans-serif",
    });
    mermaid.run({ querySelector: "pre.mermaid" });
  };
  start();
  // Diagrams carry their own colours, so they have to be re-rendered when the
  // reader flips the theme rather than restyled by CSS.
  window.addEventListener("themechange", () => {
    document.querySelectorAll("pre.mermaid").forEach((el) => {
      if (el.dataset.src) { el.innerHTML = el.dataset.src; el.removeAttribute("data-processed"); }
    });
    start();
  });
</script>
<script src="app.js"></script>
<script src="widgets.js"></script>
<script src="labs.js"></script>
<script src="sims.js"></script>
<script src="simdefs.js"></script>
</body>
</html>
